services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: schmutzfink
      POSTGRES_PASSWORD: schmutzfink
      POSTGRES_DB: schmutzfink
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schmutzfink -d schmutzfink"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Offizielle minio/minio-Images gibt es nicht mehr; Community-Build der letzten AGPL-Version.
  minio:
    image: ghcr.io/coollabsio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: schmutzfink
      MINIO_ROOT_PASSWORD: schmutzfink
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - s3

volumes:
  pgdata:
  miniodata:
