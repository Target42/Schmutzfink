services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: schmutzfink
      POSTGRES_PASSWORD: schmutzfink
      POSTGRES_DB: schmutzfink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schmutzfink -d schmutzfink"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
