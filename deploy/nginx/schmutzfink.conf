# Schmutzfink hinter nginx (TLS auf 443, App intern auf 127.0.0.1:8787).
#
# In /etc/nginx/sites-available/ kopieren, server_name und Zertifikate anpassen,
# dann: ln -s /etc/nginx/sites-available/schmutzfink /etc/nginx/sites-enabled/
#
# In der App-Umgebung (.env):
#   HTTP_ADDR=127.0.0.1:8787
#   COOKIE_SECURE=auto
#   TRUST_PROXY=auto
#
# Uploads: Bilder bis 25 MB, ZIP-Import bis 100 MB — daher client_max_body_size.

upstream schmutzfink {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name schmutzfink.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name schmutzfink.example.de;

    ssl_certificate     /etc/ssl/certs/schmutzfink.crt;
    ssl_certificate_key /etc/ssl/private/schmutzfink.key;

    client_max_body_size 110m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://schmutzfink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }
}
